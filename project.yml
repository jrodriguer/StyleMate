name: StyleMate
options:
  minimumXcodeGenVersion: 2.44.1
settings:
  base:
    SWIFT_VERSION: 6.2
packages: {}
targets:
  StyleMate:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: StyleMate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.juliorodriguez.StyleMate
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSCameraUsageDescription: "StyleMate needs camera access to capture your garments for style suggestions."
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity: "<dict><key>NSExceptionDomains</key><dict><key>palett.es</key><dict><key>NSExceptionAllowsInsecureHTTPLoads</key><true/></dict></dict></dict>"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations~iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - StyleMateTests
  StyleMateTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: StyleMateTests
    dependencies:
      - target: StyleMate
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
